services:
  - type: web
    name: himate-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: himate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: ALLSPORTS_API_KEY
        sync: false
      - key: ALLSPORTS_BASE_URL
        value: https://apiv2.allsportsapi.com

      - key: PYTHON_VERSION
        value: 3.11.9
databases:
  - name: himate-db
    plan: free
    region: oregon
